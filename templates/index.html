<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Driver Drowsiness Detection</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Driver Monitoring System</h1>
        
        <div class="row mb-4">
            <div class="col-md-8 offset-md-2">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <form id="cameraForm">
                            <div class="mb-3">
                                <label for="cameraSource" class="form-label">Select Camera Source</label>
                                <select class="form-select" id="cameraSource">
                                    <option value="0">Default Web Camera</option>
                                    <option value="1">External Web Camera (1)</option>
                                    <option value="ip">IP Camera / Mobile Camera (e.g., IP Webcam)</option>
                                </select>
                            </div>
                            <div class="mb-3 d-none" id="ipCameraInput">
                                <label for="ipUrl" class="form-label">IP Camera URL</label>
                                <input type="text" class="form-control" id="ipUrl" placeholder="http://192.168.1.100:8080/video">
                                <div class="form-text">Ensure your mobile device and computer are on the same network.</div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Set Camera & Start Monitoring</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-10 offset-md-1 text-center">
                <div class="video-container bg-dark rounded">
                    <img id="videoFeed" src="{{ url_for('video_feed') }}" class="img-fluid rounded" alt="System Starting...">
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
